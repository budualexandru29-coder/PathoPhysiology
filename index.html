<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulator Fiziopatologie Modul I</title>
<meta name="description" content="Pregătire pentru examenul practic de fiziopatologie, Modulul I: explicații pe cele 41 de întrebări, enunțuri de completat, cascade și redactare corectată pe cuvinte-cheie.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: coloană de lucru de 48rem, ca o foaie de examen; pixul albastru e al tău, pixul roșu e corectura; grila milimetrică (foaia de temperatură) apare doar pe figuri și pe bilete */
:root{
  --paper:#F1F3F6; --sheet:#FFFFFF; --sheet2:#E8ECF1; --ink:#17202B; --muted:#56616E; --line:#D3DAE2;
  --pen:#2140A8; --pen-soft:#E2E8F8; --on-pen:#FFFFFF;
  --red:#C2352A; --red-soft:#FBE4E0;
  --cold:#13708D; --cold-soft:#DCEFF4;
  --ok:#17744A; --ok-soft:#DCF1E5;
  --grid:rgba(33,64,168,.07); --rule:rgba(33,64,168,.13); --margin:rgba(194,53,42,.35);
  --shadow:0 1px 2px rgba(23,32,43,.06),0 10px 26px -18px rgba(23,32,43,.45);
  --f-display:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E131A; --sheet:#161D27; --sheet2:#1D2531; --ink:#E6EBF1; --muted:#9AA5B3; --line:#2A3441;
    --pen:#93A9FF; --pen-soft:#1E2848; --on-pen:#0E1530;
    --red:#FF7D6E; --red-soft:#3A1F1C;
    --cold:#5CC3DF; --cold-soft:#11303A;
    --ok:#5ED39A; --ok-soft:#133024;
    --grid:rgba(147,169,255,.07); --rule:rgba(147,169,255,.12); --margin:rgba(255,125,110,.35);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E131A; --sheet:#161D27; --sheet2:#1D2531; --ink:#E6EBF1; --muted:#9AA5B3; --line:#2A3441;
  --pen:#93A9FF; --pen-soft:#1E2848; --on-pen:#0E1530;
  --red:#FF7D6E; --red-soft:#3A1F1C;
  --cold:#5CC3DF; --cold-soft:#11303A;
  --ok:#5ED39A; --ok-soft:#133024;
  --grid:rgba(147,169,255,.07); --rule:rgba(147,169,255,.12); --margin:rgba(255,125,110,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.85);
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;font-variation-settings:'wdth' 100}
img,svg{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pen)}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.55rem,5.2vw,2.3rem);font-weight:800;letter-spacing:-.015em;font-variation-settings:'wdth' 112}
h2{font-size:1.2rem;font-weight:750;font-variation-settings:'wdth' 108}
h3{font-size:1.02rem;font-weight:700}
p{margin:.55em 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:48rem;margin:0 auto;padding-inline:18px;padding-block:0 72px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:48rem;margin:0 auto;padding:10px 18px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.12rem;letter-spacing:-.01em;font-variation-settings:'wdth' 118}
.brand b i{font-style:normal;color:var(--red)}
.brand span{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:650;font-size:.95rem;padding:8px 10px 10px;border-bottom:2.5px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--pen);border-bottom-color:var(--pen)}

/* ---------- buttons, chips ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 16px;font-weight:650;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink);line-height:1.2;text-align:center}
.btn:hover{border-color:var(--pen)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.soft{background:var(--pen-soft);border-color:transparent;color:var(--pen)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pen);padding-inline:10px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.92rem;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .btn{flex:1 1 180px}
.stick{position:sticky;bottom:0;z-index:10;margin:22px -18px 0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-weight:650;cursor:pointer;min-height:40px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.78rem;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:6px;background:var(--sheet2);color:var(--ink);text-decoration:none;white-space:nowrap}
a.qtag:hover{background:var(--pen-soft);color:var(--pen)}
.qtag.heat{background:var(--red-soft);color:var(--red)}
.qtag.cold{background:var(--cold-soft);color:var(--cold)}
.qtag.pen{background:var(--pen-soft);color:var(--pen)}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--sheet2);border-radius:12px;padding:4px;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer;min-height:40px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);box-shadow:var(--shadow);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--pen);flex:0 0 auto}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.panel > h2{margin-bottom:10px}

/* ---------- home ---------- */
.hero{display:grid;gap:20px;padding:26px 0 8px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.hero{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center}}
.hero .lede{color:var(--muted);max-width:52ch;font-size:1.02rem}
.tickets{position:relative;height:200px;max-width:340px;width:100%;justify-self:center;cursor:pointer;appearance:none;border:0;background:transparent;padding:0}
.ticket{position:absolute;width:62%;aspect-ratio:1.45;border-radius:6px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;text-align:left;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:10px 10px;transition:transform .25s ease}
.ticket small{font-family:var(--f-mono);font-size:.66rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket b{font-family:var(--f-mono);font-size:2.1rem;font-weight:600;color:var(--pen);line-height:1}
.ticket.t1{left:2%;top:18px;transform:rotate(-6deg)}
.ticket.t2{right:2%;top:42px;transform:rotate(5deg)}
.tickets:hover .t1{transform:rotate(-9deg) translateY(-4px)}
.tickets:hover .t2{transform:rotate(8deg) translateY(-4px)}
.chart{margin:8px 0 4px}
.chrow{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.chrow:first-child{border-top:0}
.chrow .lbl{font-weight:650;font-size:.9rem;line-height:1.25;padding-top:4px}
.chrow .lbl small{display:block;font-family:var(--f-mono);font-weight:500;font-size:.72rem;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{appearance:none;width:34px;height:34px;border-radius:7px;border:1.5px solid var(--line);background:var(--sheet);font-family:var(--f-mono);font-size:.78rem;font-weight:600;cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0;text-decoration:none}
.cell:hover{border-color:var(--pen);color:var(--pen)}
.cell.l1{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.cell.l2{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.cell.l3{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .l1{background:var(--red-soft);border-color:var(--red)} .legend .l2{background:var(--pen-soft);border-color:var(--pen)} .legend .l3{background:var(--ok);border-color:var(--ok)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.mode{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);text-decoration:none;color:var(--ink);min-width:0}
.mode:hover{border-color:var(--pen)}
.mode b{font-family:var(--f-display);font-size:1.05rem;font-weight:750;font-variation-settings:'wdth' 108}
.mode span{color:var(--muted);font-size:.92rem;line-height:1.4}
.mode em{font-style:normal;font-family:var(--f-mono);font-size:.76rem;color:var(--pen);font-weight:600;margin-top:auto}
.todo{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.todo a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.todo a:hover{border-color:var(--pen)}
.todo .t{font-size:.95rem;line-height:1.3}

/* ---------- learn list ---------- */
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);font-size:1rem;min-height:46px}
.search:focus{outline:3px solid var(--pen-soft);border-color:var(--pen)}
.chsec{margin:22px 0}
.chsec > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.qi{display:grid;grid-template-columns:3.1rem minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);text-decoration:none;color:var(--ink)}
.qi:hover{border-color:var(--pen)}
.qi .n{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--muted);padding-top:1px}
.qi .tx{font-size:.97rem;line-height:1.38}
.badge{font-family:var(--f-mono);font-size:.76rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sheet2);color:var(--muted);white-space:nowrap}
.badge.l1{background:var(--red-soft);color:var(--red)} .badge.l2{background:var(--pen-soft);color:var(--pen)} .badge.l3{background:var(--ok);color:var(--sheet)}

/* ---------- question page ---------- */
.qhead{padding:20px 0 6px}
.qhead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qhead h1{font-size:clamp(1.3rem,4.4vw,1.85rem);font-weight:750;font-variation-settings:'wdth' 104;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:650;padding:10px 12px;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:.97rem}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs a .c{font-family:var(--f-mono);font-size:.74rem;margin-left:4px;color:var(--muted)}
.sum{padding:14px 16px;border-radius:12px;background:var(--sheet);border:1px solid var(--line);font-size:1rem;line-height:1.55}
.sum .eyebrow{display:block;margin-bottom:4px}
.blk{margin:18px 0}
.blk > h3,.blk-h{font-family:var(--f-display);font-size:1.08rem;font-weight:750;margin:26px 0 8px;font-variation-settings:'wdth' 106}
.def{padding:12px 14px;border-radius:10px;background:var(--pen-soft)}
.def dt{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pen);font-weight:600}
.def dd{margin:4px 0 0}
.blk ul,.blk ol{margin:6px 0;padding-left:1.3em}
.blk li{margin:4px 0}
.blk .lt{font-weight:700;margin:0 0 4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.col{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);min-width:0}
.col h4{margin:0 0 6px;font-family:var(--f-display);font-size:.98rem;font-weight:750}
.col ul{margin:0;padding-left:1.15em}
.col li{margin:4px 0;font-size:.96rem;line-height:1.45}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.tblw caption{caption-side:top;text-align:left;font-weight:700;padding:10px 12px 0;font-size:.95rem}
table.t{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.42}
table.t th,table.t td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
table.t thead th{border-top:0;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sheet2)}
table.t td:first-child{min-width:7.5rem}
.box{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--sheet)}
.box > .bt{display:block;font-weight:700;margin-bottom:4px}
.box.tip{background:var(--ok-soft);border-color:transparent}
.box.tip > .bt{color:var(--ok)}
.box.note{background:var(--red-soft);border-color:transparent}
.box.note > .bt{color:var(--red)}
details.box > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between}
details.box > summary::-webkit-details-marker{display:none}
details.box > summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-weight:600}
details.box[open] > summary::after{content:"−"}
details.box > summary .k{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
details.box.ctx{background:var(--sheet2);border-color:transparent}
details.box > div{margin-top:8px}
details.box ol,details.box ul{margin:4px 0;padding-left:1.3em}
.plan{counter-reset:p;list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.plan li{counter-increment:p;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;align-items:start;padding:8px 12px;border-radius:10px;background:var(--sheet);border:1px solid var(--line);font-size:.97rem;line-height:1.42}
.plan li::before{content:counter(p);font-family:var(--f-mono);font-weight:600;color:var(--pen);text-align:right}
.srcline{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-top:20px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--sheet);min-width:0}
.pager a:hover{border-color:var(--pen)}
.pager a small{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.pager a span{font-size:.92rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pager a.nx{text-align:right}

/* ---------- flows ---------- */
.flow{container-type:inline-size;margin:18px 0;padding:14px 14px 16px;border:1px solid var(--line);border-radius:14px;background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.flow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap;margin-bottom:14px}
.flow-h > b{font-family:var(--f-display);font-weight:750;font-size:1.02rem;line-height:1.25;font-variation-settings:'wdth' 106;flex:1 1 13rem;text-wrap:balance}
.flow-tools{display:flex;gap:6px;flex-wrap:wrap}
.flow-tools .btn{min-height:34px;padding:5px 11px;font-size:.84rem;border-radius:8px}
.flow-tools .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fl{max-width:34rem;margin:0 auto}
.fi{position:relative}
/* conector: un singur SVG (linie + vârf), centrat; verbul stă în dreapta liniei */
.fc{position:relative;display:flex;justify-content:center;line-height:0}
.fc .ca{display:block;overflow:visible}
.ca line{stroke:var(--muted);stroke-width:2;stroke-linecap:butt}
.ca path{fill:var(--muted)}
.flab{position:absolute;left:calc(50% + 13px);top:50%;transform:translateY(-50%);max-width:calc(50% - 16px);font-size:.78rem;font-style:italic;line-height:1.15;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc.tofork .ca path{display:none}
/* pasul */
.fn{appearance:none;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;width:100%;margin:0;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--sheet);color:var(--ink);font:inherit;line-height:1.35}
.fn.nonum{grid-template-columns:minmax(0,1fr)}
button.fn{cursor:pointer}
button.fn:hover{border-color:var(--pen)}
.fnum{display:grid;place-items:center;min-width:23px;height:23px;padding:0 5px;border-radius:99px;background:var(--sheet2);font-family:var(--f-mono);font-size:.72rem;font-weight:600;color:var(--muted);margin-top:1px}
.fb{display:flex;flex-direction:column;gap:2px;min-width:0}
.fz{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--pen);font-weight:600;line-height:1.3}
.ftt{font-weight:700;font-size:.95rem;line-height:1.3;overflow-wrap:break-word;hyphens:auto}
.fd{font-size:.84rem;color:var(--muted);line-height:1.38;overflow-wrap:break-word;hyphens:auto}
.fx{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);opacity:.85}
.fq{align-self:flex-start;margin-top:3px;font-size:.74rem;font-weight:650;color:var(--pen);border-bottom:1px dotted currentColor;line-height:1.2}
.fn[aria-expanded="true"]{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen-soft)}
.fn[aria-expanded="true"] .fq{display:none}
.why{display:none;margin-top:6px;padding:2px 0 2px 10px;border-left:2px solid var(--pen);font-size:.86rem;line-height:1.45;color:var(--ink)}
.fn[aria-expanded="true"] .why{display:block}
.fn.start{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fn.start .fd,.fn.start .why,.fn.start .fx{color:var(--paper);opacity:.82}
.fn.start .fz,.fn.start .fq{color:var(--paper);opacity:.8}
.fn.start .why{border-left-color:var(--paper)}
.fn.start .fnum{background:color-mix(in srgb,var(--paper) 18%,transparent);color:var(--paper)}
.fn.end{border-color:var(--red);background:var(--red-soft)}
.fn.end .fnum{background:var(--sheet);color:var(--red)}
.flow.cold .fn.end{border-color:var(--cold);background:var(--cold-soft)}
.flow.cold .fn.end .fnum{color:var(--cold)}
.flow.pen .fn.end{border-color:var(--pen);background:var(--pen-soft)}
.flow.pen .fn.end .fnum{color:var(--pen)}
/* inhibitor: bară în T spre pas */
.side{position:relative;width:fit-content;max-width:88%;margin:12px 0 0 auto;padding:6px 10px;border:1.5px dashed var(--red);border-radius:9px;background:var(--sheet);color:var(--red);font-size:.84rem;font-weight:650;line-height:1.3}
.side::before{content:"";position:absolute;top:-12px;right:24px;height:11px;border-left:2px solid var(--red)}
.side::after{content:"";position:absolute;top:-13px;right:16px;width:18px;border-top:2.5px solid var(--red)}
/* bifurcație și reunire: fiecare coloană își desenează jumătatea de bară din mijlocul ei */
.fork{position:relative;display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px}
.fork.n2{--n:2} .fork.n3{--n:3} .fork.n4{--n:4}
.fcol{position:relative;display:flex;flex-direction:column;min-width:0}
.fork > .fcol::before,.fork.join > .fcol::after{content:"";position:absolute;left:-5px;right:-5px;height:0}
.fork > .fcol::before{top:0;border-top:2px solid var(--muted)}
.fork.join > .fcol::after{bottom:0;border-bottom:2px solid var(--muted)}
.fork > .fcol:first-of-type::before,.fork.join > .fcol:first-of-type::after{left:50%;margin-left:-1px}
.fork > .fcol:last-of-type::before,.fork.join > .fcol:last-of-type::after{right:50%;margin-right:-1px}
.fcol .fn{flex:0 0 auto}
.rise{flex:1 1 auto;align-self:center;width:2px;min-height:12px;background:var(--muted)}
.fpar{display:none}
@container (max-width: 520px){
  .fork.st{grid-template-columns:minmax(0,1fr);gap:8px;padding:26px 8px 8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--sheet)}
  .fork.st > .fcol::before,.fork.st > .fcol::after,.fork.st .fc.drop,.fork.st .rise{display:none}
  .fork.st .fcol + .fcol{border-top:1.5px dashed var(--line);padding-top:10px}
  .fork.st .fpar{display:block;position:absolute;top:7px;left:10px;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .fc.tofork.st .ca path{display:block}
}
@container (max-width: 460px){
  .fork.n2:not(.st) .fn{grid-template-columns:minmax(0,1fr);gap:4px;padding:9px 10px}
  .fork.n2:not(.st) .fnum{justify-self:start}
  .fork.n2:not(.st) .ftt{font-size:.9rem}
  .fork.n2:not(.st) .fd{font-size:.8rem}
}
.flow.plain{border:0;padding:4px 0 0;background:none}
.fd ul{margin:4px 0 0;padding-left:1.1em}
.fd li{margin:2px 0}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.routes > div{padding:9px 11px;border:1.5px solid var(--cold);border-radius:10px;background:var(--cold-soft);font-size:.88rem;line-height:1.35;min-width:0}
.routes b{display:block;font-size:.93rem}
.routes span{color:var(--muted)}
/* doar esențialul */
body.ess .fd,body.ess .fq,body.ess .why,body.ess .fx,body.ess .flow-tip{display:none!important}
.flow[data-step] .fi.hid{display:none}
.flow-foot{display:flex;justify-content:center;gap:8px;margin-top:14px}
.flow-foot[hidden]{display:none}
.flow-tip{margin:12px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}

/* ---------- figures ---------- */
figure.fig{margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sheet)}
figure.fig figcaption{font-size:.88rem;color:var(--muted);margin-top:10px;line-height:1.45}
figure.fig .ft{font-family:var(--f-display);font-weight:750;font-size:1rem;margin-bottom:10px;display:block;font-variation-settings:'wdth' 106}
.svgw{overflow-x:auto}
.svgw svg{display:block;margin:0 auto;height:auto}
.fig svg text{fill:var(--ink);font-family:var(--f-body)}
.fig svg .mu{fill:var(--muted)}
.fig svg .mono{font-family:var(--f-mono)}
.fig svg .ln{stroke:var(--muted);fill:none}
.fig svg .ink{stroke:var(--ink);fill:none}
.fig svg .gr{stroke:var(--grid);stroke-width:1}
.fig svg .b-heat{fill:var(--red-soft);stroke:var(--red)}
.fig svg .b-cold{fill:var(--cold-soft);stroke:var(--cold)}
.fig svg .b-ok{fill:var(--ok-soft);stroke:var(--ok)}
.fig svg .b-pen{fill:var(--pen-soft);stroke:var(--pen)}
.fig svg .b-sheet{fill:var(--sheet);stroke:var(--line)}
.fig svg .b-sheet2{fill:var(--sheet2);stroke:none}
.fig svg .s-heat{stroke:var(--red);fill:none}
.fig svg .s-cold{stroke:var(--cold);fill:none}
.fig svg .s-pen{stroke:var(--pen);fill:none}
.fig svg .s-ok{stroke:var(--ok);fill:none}
.fig svg .f-heat{fill:var(--red)}
.fig svg .f-cold{fill:var(--cold)}
.fig svg .f-pen{fill:var(--pen)}
.fig svg .f-muted{fill:var(--muted)}
.fig svg .f-ink{fill:var(--ink)}
.fig svg .t-heat{fill:var(--red)}
.fig svg .t-cold{fill:var(--cold)}
.fig svg .t-pen{fill:var(--pen)}
.lg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:0 0 10px}
.lg span{display:inline-flex;align-items:center;gap:7px}
.lg i{display:inline-block;width:24px;border-top:3px solid var(--red)}
.lg i.d{border-top:2px dashed var(--pen)}
.figsteps{margin:4px 0 0;padding:0;list-style:none;counter-reset:fs;display:grid;gap:4px}
.figsteps li{counter-increment:fs;display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:6px}
.figsteps li::before{content:counter(fs);display:grid;place-items:center;width:18px;height:18px;margin-top:2px;border-radius:50%;background:var(--pen);color:var(--sheet);font-family:var(--f-mono);font-size:.7rem;font-weight:700}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.duo > div{min-width:0}
.duo h4{margin:0 0 6px;font-family:var(--f-display);font-size:.95rem;font-weight:750}
.phases{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.phases li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:8px;font-size:.92rem;line-height:1.4}
.phases li b.n{font-family:var(--f-mono);color:var(--pen)}
/* HTML trees */
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line)}
.layer b{display:block;font-family:var(--f-display);font-weight:750}
.layer span{font-size:.88rem;color:var(--muted)}
.layer em{font-style:normal;font-family:var(--f-mono);font-size:.76rem;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sheet2);white-space:nowrap}
.layer.l-a{border-color:var(--ink);background:var(--sheet2)}
.layer.l-b{border-color:var(--pen);background:var(--pen-soft);margin-left:14px}
.layer.l-c{border-color:var(--cold);background:var(--cold-soft);margin-left:28px}

/* ---------- cloze ---------- */
.cz{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:1.02rem;line-height:2.15}
.cz + .cz{margin-top:10px}
.cz .cq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;line-height:1.3;margin-bottom:6px}
.cz .cq .tx{font-size:.84rem;color:var(--muted);line-height:1.3}
.bl{display:inline-block;vertical-align:baseline;border:0;border-bottom:2px solid var(--pen);background:var(--pen-soft);border-radius:6px 6px 0 0;padding:1px 6px;margin:0 2px;min-width:5ch;max-width:100%;font-size:1rem;line-height:1.5;color:var(--pen);font-weight:600}
.bl:focus{outline:2px solid var(--pen);outline-offset:1px}
.bl.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bl.near{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bl.no{background:var(--red-soft);border-color:var(--red);color:var(--red);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix{display:inline-block;font-weight:700;color:var(--red);margin:0 4px 0 2px;font-size:.95rem}
.fix::before{content:"→ ";font-family:var(--f-mono)}
.nearn{display:inline-block;font-size:.8rem;color:var(--ok);margin-left:2px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.3}
.bank button{appearance:none;border:1px dashed var(--muted);background:transparent;border-radius:8px;padding:4px 10px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.bank button.used{opacity:.35}
.progress{height:8px;background:var(--sheet2);border-radius:99px;overflow:hidden;margin:10px 0}
.progress > i{display:block;height:100%;background:var(--pen);border-radius:99px;transition:width .25s ease}
.czscore{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--sheet);border:1px solid var(--line);margin:12px 0}
.czscore b{font-family:var(--f-mono);font-size:1.6rem;font-weight:600}

/* ---------- writing ---------- */
.qcard{padding:14px 16px;border-radius:12px;background:var(--sheet);border:1px solid var(--line)}
.qcard .eyebrow{display:block;margin-bottom:4px}
.qcard p{margin:0;font-weight:650;font-size:1.04rem;line-height:1.4}
.timerbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 8px;flex-wrap:wrap}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.15rem;padding:4px 10px;border-radius:8px;background:var(--sheet2)}
.timer.low{color:var(--red);background:var(--red-soft)}
.sheetw{position:relative}
textarea.sheet{width:100%;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px 46px;background-color:var(--sheet);color:var(--pen);font-size:1.02rem;line-height:32px;
  background-image:linear-gradient(90deg,transparent 34px,var(--margin) 34px,var(--margin) 35.5px,transparent 35.5px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-attachment:local;background-position:0 6px}
textarea.sheet:focus{outline:3px solid var(--pen-soft);border-color:var(--pen)}
textarea.sheet::placeholder{color:var(--muted)}
.count{margin:8px 0 0;font-size:.95rem;color:var(--muted)}
.count b{color:var(--ink);font-family:var(--f-mono)}
.hintbox{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--pen-soft);font-size:.95rem}
.hintbox ol{margin:6px 0 0;padding-left:1.3em}

/* ---------- results ---------- */
.verdict{padding:18px 0 4px}
.verdict .was{margin:0;color:var(--muted);font-weight:600}
.verdict h1{font-size:clamp(1.25rem,4.2vw,1.7rem);margin:.2em 0 .3em;font-variation-settings:'wdth' 104}
.scorebox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin:14px 0;padding:16px;background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.grade{position:relative;width:96px;height:96px;display:grid;place-items:center;border:3px solid var(--red);border-radius:50%;color:var(--red);transform:rotate(-8deg)}
.grade b{font-family:var(--f-mono);font-size:2rem;font-weight:600;line-height:1}
.grade small{position:absolute;bottom:14px;font-family:var(--f-mono);font-size:.7rem}
.grade.g3{border-color:var(--ok);color:var(--ok)} .grade.g2{border-color:var(--pen);color:var(--pen)}
.bars{display:grid;gap:8px;min-width:0}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:center;font-size:.88rem}
.brow .track{grid-column:1 / -1;grid-row:2}
.brow > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:var(--sheet2);border-radius:99px;overflow:hidden}
.fill{display:block;height:100%;background:var(--pen);border-radius:99px}
.brow .n{text-align:right;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.sec{margin:20px 0}
.sec > h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.frac{font-family:var(--f-mono);font-size:.88rem;color:var(--muted);font-weight:600}
.sub{font-size:.82rem;color:var(--muted);font-weight:700;margin:14px 0 6px;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pt{appearance:none;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:.96rem;line-height:1.35}
.pt .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;border:1.5px solid var(--red);color:var(--red)}
.pt.hit{border-color:transparent;background:var(--ok-soft)}
.pt.hit .mk{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.pt:not(.hit) .lbl{color:var(--ink)}
.pt .w{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);padding-top:3px}
.pt .man{font-size:.78rem;color:var(--muted);font-style:italic}
.transcript{white-space:pre-wrap;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.97rem;color:var(--pen);line-height:1.6}
.transcript mark{background:var(--ok-soft);color:var(--ok);border-radius:3px;padding:0 1px;font-weight:600}
details.sec > summary{cursor:pointer;font-weight:750;font-size:1.05rem;font-family:var(--f-display)}

/* ---------- cascade ---------- */
.kz{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--sheet);margin:14px 0}
.kz h3{margin-bottom:10px}
.kz-order{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:k}
.kz-order li{counter-increment:k}
.kz-slot{appearance:none;width:100%;display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--pen);background:var(--pen-soft);color:var(--ink);cursor:pointer;font-size:.95rem;line-height:1.35}
.kz-slot::before{content:counter(k);font-family:var(--f-mono);font-weight:600;color:var(--pen);text-align:right}
.kz-slot .x{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}
.kz-slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.kz-slot.ok::before{color:var(--ok)}
.kz-slot.no{border-color:var(--red);background:var(--red-soft)}
.kz-slot.no::before{color:var(--red)}
.kz-empty{padding:12px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.92rem;text-align:center}
.kz-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.kz-pool button{appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.93rem;line-height:1.3;text-align:left;max-width:100%;color:var(--ink)}
.kz-pool button:hover{border-color:var(--pen)}
.kz-sol{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--sheet2);font-size:.92rem}
.kz-sol ol{margin:4px 0 0;padding-left:1.4em}

/* ---------- exam ---------- */
.drawstage{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin:18px 0}
.slip{position:relative;padding:16px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);min-height:170px;display:flex;flex-direction:column;gap:8px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px;animation:slipin .45s ease both}
.slip:nth-child(2){animation-delay:.12s}
.slip .no{font-family:var(--f-mono);font-size:2.4rem;font-weight:600;color:var(--pen);line-height:1}
.slip p{margin:0;font-weight:600;line-height:1.4}
@keyframes slipin{from{opacity:.0;transform:translateY(12px) rotate(-2deg)}to{opacity:1;transform:none}}
.examq{margin:22px 0}
.examstick{align-items:center}
.examstick .timer{flex:0 0 auto}
.examstick .btn{flex:1 1 140px}
.examq .qcard{margin-bottom:10px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);font-size:.92rem}
.hist .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.hist .s{font-family:var(--f-mono);font-weight:600}

/* ---------- atlas ---------- */
.atl{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.atl-card{min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
.atl-card header{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.atl-card header b{font-family:var(--f-display);font-weight:750}
.schbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.schbar .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chsec{scroll-margin-top:120px}
.atl-card .flow,.atl-card figure.fig{margin:10px 0 0;border:0;padding:6px 0 0;background-color:transparent}

@media (min-width:900px){
  .wrap{max-width:52rem}
  .hdr-in{max-width:52rem;flex-direction:row;align-items:center;justify-content:space-between;padding-top:0}
  .nav{margin:0}
  .nav a{padding:16px 9px 14px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- figuri interactive (FX) ---------- */
figure.xfig{--fx-r:12px}
.fx-meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin:-4px 0 10px}
.fx-kind,.fx-qs a,.fx-qs span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;white-space:nowrap}
.fx-kind.met{border-color:var(--cold);color:var(--cold)}
.fx-kind.chart{border-color:var(--pen);color:var(--pen)}
.fx-kind.lit{border-color:var(--ok);color:var(--ok)}
.fx-qs{display:contents}
.fx-note{font-size:.84rem;color:var(--muted);margin:0 0 10px;line-height:1.4}
.fx-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 10px}
.fx-modes{max-width:100%;display:flex;flex-wrap:wrap;overflow:visible}
.fx-modes button{padding:7px 11px;min-height:40px}
.fx-hint{font-size:.86rem;color:var(--muted);margin:0 0 8px;line-height:1.4}

/* control: singura variabilă */
.fx-ctl{padding:10px 12px 8px;border:1px solid var(--line);border-radius:var(--fx-r);background:var(--sheet2);margin:0 0 10px}
.fx-ctl > .fx-cl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:.92rem;margin:0 0 2px}
.fx-ctl output{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;color:var(--pen)}
.fx-range{width:100%;height:40px;margin:0;accent-color:var(--pen);background:transparent;cursor:pointer}
.fx-stops{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fx-stops button{appearance:none;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:7px 11px;font-weight:650;cursor:pointer;min-height:40px;font-size:.9rem;line-height:1.25;text-align:left;color:var(--ink)}
.fx-stops button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.fx-now{font-size:.9rem;margin:6px 0 0;line-height:1.4;color:var(--muted)}
.fx-now b{color:var(--ink)}

/* scenă */
.fx-stage{position:relative;margin:0 0 10px}
.fx-stage svg{display:block;width:100%;height:auto;margin:0 auto;overflow:visible}
.fx-stage svg .t{font-size:11px;font-family:var(--f-body);fill:var(--ink)}
.fx-stage svg .tb{font-weight:700}
.fx-stage svg .tm{fill:var(--muted)}
.xfig .off{opacity:.34}
.xfig [data-p]{cursor:pointer}
.xfig[data-mode="labels"] [data-p],.xfig[data-mode="predict"][data-rev="0"] [data-p]{cursor:default}
.xfig svg .seg-r{stroke-width:1.2;transition:stroke-width .15s,fill-opacity .15s}
.xfig svg .seg-r.on{stroke-width:2.6}
.xfig svg .seg-r.dim{fill-opacity:.55}
.xfig svg g.seg{cursor:pointer}
.xfig svg g.seg:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.xfig svg .cur-l{stroke:var(--ink);stroke-width:1.6}
.xfig svg .cur-h{fill:var(--ink)}
.xfig svg .merc{transition:y .12s,height .12s}
.xfig svg .grab{cursor:ns-resize;touch-action:none}

/* etichete ascunse */
.xfig .lab .lq{display:none}
.xfig[data-mode="labels"] .lab .lr{display:none}
.xfig[data-mode="labels"] .lab .lq{display:inline-flex}
.xfig[data-mode="labels"] .lab.filled .lr{display:inline}
.xfig[data-mode="labels"] .lab.filled .lq{display:none}
.xfig .lab .lq{align-items:center;justify-content:center;min-width:34px;min-height:20px;padding:0 8px;border-radius:7px;border:1.5px dashed var(--pen);background:var(--pen-soft);color:var(--pen);font-family:var(--f-mono);font-weight:700;cursor:pointer;font-size:.85rem}
.xfig .lab.sel .lq{outline:3px solid var(--pen);outline-offset:1px}
.xfig .lab.ok .lr{color:var(--ok);font-weight:700}
.xfig .lab.no .lr{color:var(--red);font-weight:700}
.xfig svg .lab .lq-r{fill:var(--pen-soft);stroke:var(--pen);stroke-width:1.5;stroke-dasharray:4 3}
.xfig svg .lab .lq-t{fill:var(--pen);font-family:var(--f-mono);font-weight:700;font-size:12px;text-anchor:middle}
.xfig svg g.lab{cursor:default}
.xfig svg g.lab .lq{display:none}
.xfig[data-mode="labels"] svg g.lab .lr{display:none}
.xfig[data-mode="labels"] svg g.lab .lq{display:inline}
.xfig[data-mode="labels"] svg g.lab.filled .lr{display:inline}
.xfig[data-mode="labels"] svg g.lab.filled .lq{display:none}
.xfig[data-mode="labels"] svg g.lab{cursor:pointer}
.xfig svg g.lab.sel .lq-r{stroke-width:3;fill:var(--sheet)}
.xfig svg g.lab.ok .lr{fill:var(--ok);font-weight:700}
.xfig svg g.lab.no .lr{fill:var(--red);font-weight:700}

/* panou cu pașii activi (lanțuri) */
.fx-panel{display:grid;gap:12px;margin:0 0 10px}
.fx-grp{border:1px solid var(--line);border-radius:var(--fx-r);padding:10px 12px;background:var(--sheet)}
.fx-grp > h4{margin:0 0 8px;font-family:var(--f-display);font-size:.92rem;font-weight:750;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fx-grp > h4 small{font-family:var(--f-mono);font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fx-chain{display:grid;gap:0;margin:0;padding:0;list-style:none}
.fx-chain > li{display:grid;justify-items:stretch}
.fx-chain > li + li{margin-top:18px;position:relative}
.fx-chain > li + li::before{content:"";position:absolute;left:50%;top:-18px;height:18px;border-left:2px solid var(--muted)}
.fx-chain > li + li::after{content:"";position:absolute;left:calc(50% - 5px);top:-7px;border:5px solid transparent;border-top:7px solid var(--muted);border-bottom:0}
.fx-chain.flat > li + li{margin-top:8px}
.fx-chain.flat > li + li::before,.fx-chain.flat > li + li::after{display:none}
.fxp.fxn{appearance:none;display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 12px;line-height:1.35;font-size:.93rem;min-height:44px}
.fxp.fxn b{display:block;font-weight:700}
.fxp.fxn .fxs{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.fxp.fxn.heat{border-color:var(--red);background:var(--red-soft)}
.fxp.fxn.cold{border-color:var(--cold);background:var(--cold-soft)}
.fxp.fxn.ok{border-color:var(--ok);background:var(--ok-soft)}
.fxp.fxn.pen{border-color:var(--pen);background:var(--pen-soft)}
.fxp.fxn.ctxn{border-style:dashed}
.fxp.fxn[aria-pressed="true"]{outline:3px solid var(--pen);outline-offset:1px}
.fxp.fxn.seen::after{content:"✓";float:right;color:var(--ok);font-weight:700;font-family:var(--f-mono)}
.fxp.fxn:hover{filter:brightness(.98)}
.fx-gap{padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.9rem}

/* detaliu */
.fx-detail{border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:10px;background:var(--sheet);padding:10px 12px;margin:0 0 10px;min-height:64px}
.fx-detail .k{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.fx-detail .k.ctx{color:var(--red)}
.fx-detail b.t{display:block;font-weight:750;margin-bottom:3px}
.fx-detail p{margin:.2em 0;font-size:.93rem;line-height:1.45}
.fx-detail .rt{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0;padding:0;list-style:none}
.fx-detail .rt li{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--sheet2);line-height:1.35}
.fx-detail .rt li b{font-family:var(--f-mono);color:var(--pen)}
.fx-detail .src{font-size:.8rem;color:var(--muted);margin-top:6px}
.fx-empty{color:var(--muted);font-size:.9rem}

/* prezice */
.fx-quiz{border:1.5px solid var(--pen);border-radius:var(--fx-r);background:var(--pen-soft);padding:12px;margin:0 0 10px}
.fx-quiz > b{display:block;font-weight:750;margin-bottom:8px}
.fx-qi{display:flex;flex-wrap:wrap;gap:7px}
.fx-qi button{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:.9rem;line-height:1.3;text-align:left;cursor:pointer;min-height:40px;max-width:100%}
.fx-qi button[aria-pressed="true"]{border-color:var(--pen);background:var(--pen);color:var(--on-pen)}
.fx-qi button.hit{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.fx-qi button.miss{border-color:var(--ok);border-style:dashed;background:var(--sheet);color:var(--ink)}
.fx-qi button.bad{border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.fx-qi button.hit::before,.fx-qi button.miss::before{content:"✓ ";color:var(--ok);font-weight:700}
.fx-qi button.bad::before{content:"✗ ";color:var(--red);font-weight:700}
.fx-qi button.miss::before{content:"+ "}
.fx-dir{display:grid;gap:7px}
.fx-dir > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.fx-dir .dl{font-size:.9rem;line-height:1.3}
.fx-dir .db{display:flex;gap:4px}
.fx-dir .db button{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:9px;min-width:44px;min-height:40px;font-weight:700;font-size:1.05rem;cursor:pointer}
.fx-dir .db button[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.fx-dir .db button.hit{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.fx-dir .db button.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.fx-dir .db button.miss{border-color:var(--ok);border-style:dashed;color:var(--ink)}
.fx-res{margin:10px 0 0;font-size:.92rem}
.fx-res b{font-family:var(--f-mono)}
.fx-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fx-act .btn{flex:1 1 140px}

/* bancă de etichete */
.fx-bank{border:1.5px solid var(--pen);border-radius:var(--fx-r);background:var(--pen-soft);padding:12px;margin:0 0 10px}
.fx-bank > b{display:block;font-weight:750;margin-bottom:4px}
.fx-bank .bk{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.fx-bank .bk button{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:.9rem;line-height:1.3;text-align:left;cursor:pointer;min-height:40px;max-width:100%}
.fx-bank .bk button.used{opacity:.4}
.fx-bank .bk button:focus-visible{outline:3px solid var(--pen)}

/* progres și sursă */
.fx-prog{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.fx-prog span{display:inline-flex;gap:6px;align-items:center}
.fx-prog i{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--sheet2);overflow:hidden;vertical-align:middle}
.fx-prog i u{display:block;height:100%;background:var(--ok);text-decoration:none}
.fx-prog b{font-family:var(--f-mono);color:var(--ink)}
figure.xfig figcaption .nm{display:block;margin-top:4px}
.fx-best{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.xfig svg .seg-r,.xfig svg .merc{transition:none!important}}
@media (max-width:420px){figure.xfig{padding:12px 10px}.fx-ctl{padding:8px 10px 6px}}

/* ---------- desene în stilul skill-ului anima (kit izometric), legate de tema simulatorului ---------- */
figure.xfig{
  --sk:1;--tw:62%;
  --anatomy-paper:var(--sheet);
  --anatomy-face:color-mix(in srgb,#fff var(--tw),var(--sheet));
  --anatomy-top:color-mix(in srgb,#fff var(--tw),var(--sheet));
  --anatomy-shade-3:color-mix(in srgb,#000 calc(var(--sk)*4%),var(--sheet));
  --anatomy-shade-2:color-mix(in srgb,#000 calc(var(--sk)*8%),var(--sheet));
  --anatomy-shade-1:color-mix(in srgb,#000 calc(var(--sk)*13%),var(--sheet));
  --anatomy-shade-0:color-mix(in srgb,#000 calc(var(--sk)*19%),var(--sheet));
  --anatomy-hi:var(--ink);
  --anatomy-mid:color-mix(in srgb,var(--ink) 58%,var(--sheet));
  --anatomy-lo:color-mix(in srgb,var(--ink) 36%,var(--sheet));
  --anatomy-faint:color-mix(in srgb,var(--ink) 18%,var(--sheet));
  --anatomy-lit:var(--ink);--anatomy-dot:var(--ink);
  --anatomy-red:var(--red);--anatomy-blue:var(--cold);--anatomy-green:var(--ok);
  --anatomy-weight:.7px;
  --anatomy-halo:#000;--anatomy-halo-opacity:.18;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) figure.xfig{--sk:2.4;--tw:7%}}
:root[data-theme="dark"] figure.xfig{--sk:2.4;--tw:7%}
.xfig .iso-svg{display:block;width:100%;height:auto;overflow:visible}
.xfig .iso-svg path,.xfig .iso-svg circle{vector-effect:non-scaling-stroke}
.xfig .iso-fill{fill:var(--anatomy-paper);stroke:none}
.xfig .iso-shade,.xfig .iso-top{stroke:none}
.xfig .iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.xfig .iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.xfig .iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.xfig .iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.xfig .iso-top{fill:var(--anatomy-top)}
.xfig .iso-solid[data-seamless]>.iso-shade,.xfig .iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.xfig .iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.xfig .iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.xfig .iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.xfig .iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.xfig .iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.xfig .iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.xfig .iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.xfig .iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.xfig .iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.xfig .iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.xfig .tb-body{fill:var(--anatomy-shade-2);stroke:none}
.xfig .tb-shine{fill:var(--anatomy-top);stroke:none}
.xfig .tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.xfig .bio-blob-base{fill:var(--anatomy-shade-2)}
.xfig .bio-blob-shade{fill:var(--anatomy-shade-0);opacity:.55}
.xfig .bio-blob-highlight{fill:var(--anatomy-top);opacity:.6}
.xfig .bio-blob-edge{fill:none}
/* sânge arterial / venos */
.xfig .pp.a .tb-body{fill:color-mix(in srgb,var(--red) 52%,var(--anatomy-shade-2))}
.xfig .pp.v .tb-body{fill:color-mix(in srgb,var(--cold) 52%,var(--anatomy-shade-2))}
.xfig .pp.a .tb-shine,.xfig .pp.v .tb-shine{opacity:.7}
.xfig svg .co .lead{fill:none;stroke:var(--anatomy-mid);stroke-width:.8}
.xfig svg .co .lead-d{fill:var(--anatomy-hi);stroke:none}
.xfig svg .hit{fill:transparent;stroke:none}
.xfig svg .fxp:hover .hit{fill:var(--pen);fill-opacity:.12;stroke:var(--pen);stroke-width:1.4}
.xfig svg .fxp.sel .hit{fill:var(--pen);fill-opacity:.16;stroke:var(--pen);stroke-width:2.2}
.xfig svg .fxp:focus-visible{outline:none}
.xfig svg .fxp:focus-visible .hit{stroke:var(--pen);stroke-width:2.6;fill:var(--pen);fill-opacity:.12}
.xfig svg .bdg-s circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.xfig svg .bdg-s text{fill:var(--ink);font:700 10.5px var(--f-mono)}
.xfig[data-mode="labels"] svg .bdg-s circle{stroke:var(--pen);stroke-width:1.6}

/* butonul de mișcare și redarea */
.fx-anim{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--muted);border-radius:999px;font:inherit;font-size:.82rem;font-weight:650;padding:6px 12px;min-height:34px;cursor:pointer}
.fx-anim[aria-pressed="true"]{color:var(--ink)}
.fx-playrow{display:flex;margin:2px 0 0}
.fx-play{min-height:40px;padding:6px 14px}
.xfig[data-mode="predict"] .fx-playrow{display:none}

/* jocuri: ordonează, sortează */
.fx-game{border:1.5px solid var(--pen);border-radius:var(--fx-r);background:var(--pen-soft);padding:12px;margin:0 0 10px}
.fx-game > b{display:block;font-weight:750;margin-bottom:8px}
.fx-ord-seq{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;counter-reset:o}
.fx-ord-seq li{margin:0}
.fx-ord-seq li.empty{color:var(--muted);font-size:.9rem;padding:8px 2px}
.fx-ord-seq button{appearance:none;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:1.3;color:var(--ink);border:1.5px solid var(--pen);background:var(--sheet);border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer}
.fx-ord-seq button i{flex:0 0 auto;font-style:normal;font-family:var(--f-mono);font-weight:700;color:var(--on-pen);background:var(--pen);border-radius:7px;min-width:26px;text-align:center;padding:1px 0}
.fx-ord-seq li.hit button{border-color:var(--ok);background:var(--ok-soft)}
.fx-ord-seq li.hit button i{background:var(--ok);color:#fff}
.fx-ord-seq li.bad button{border-color:var(--red);background:var(--red-soft)}
.fx-ord-seq li.bad button i{background:var(--red);color:#fff}
.fx-ord-seq button:disabled{opacity:1;cursor:default}
.fx-ord-pool{display:grid;gap:7px}
.fx-ord-pool button{appearance:none;text-align:left;font:inherit;font-size:.92rem;line-height:1.3;color:var(--ink);border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 11px;min-height:44px;cursor:pointer}
.fx-ord-pool button:hover{border-color:var(--pen)}
.fx-ord-key{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;counter-reset:k}
.fx-ord-key li{counter-increment:k}
.fx-ord-key li .fxn::before{content:counter(k) ". ";font-family:var(--f-mono);color:var(--muted)}
.fx-pool,.fx-bins{display:flex;flex-wrap:wrap;gap:7px}
.fx-pool{margin:0 0 10px}
.fx-game .chip{appearance:none;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 11px;font:inherit;font-size:.9rem;line-height:1.3;text-align:left;cursor:pointer;min-height:40px;max-width:100%}
.fx-game .chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen);color:var(--on-pen)}
.fx-game .chip.hit{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.fx-game .chip.bad{border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.fx-game .chip small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.fx-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fx-bin{border:1.5px dashed var(--pen);border-radius:12px;background:var(--sheet);padding:8px;display:grid;gap:6px;align-content:start;min-height:84px}
.fx-bin .bh{appearance:none;border:0;background:var(--pen-soft);color:var(--ink);font:inherit;text-align:left;border-radius:8px;padding:7px 9px;cursor:pointer;min-height:40px}
.fx-bin .bh b{display:block;font-weight:750}
.fx-bin .bh small{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:1px}
.fx-bin .bc{display:grid;gap:6px}
.fx-bin.cold .bh{background:var(--cold-soft)}
.fx-bin.heat .bh{background:var(--red-soft)}
.fx-bin .bh:disabled{opacity:1;cursor:default}

/* ---------- Î1: circuitul ---------- */
.circ{display:grid;gap:10px}
.circ .defchip{appearance:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border:1.5px solid var(--pen);background:var(--pen-soft);border-radius:10px;padding:8px 12px;display:grid;gap:1px;min-height:44px}
.circ .defchip span{font-size:.84rem;color:var(--muted)}
.circ .defchip.sel{outline:3px solid var(--pen);outline-offset:1px}
.circ-svg{max-width:520px;margin:0 auto}
.circ-svg .heat{opacity:calc(var(--dil,0)*.9);transition:opacity .9s}
.circ-svg .skinlv{opacity:0;transition:opacity .8s}
.circ-svg .skinlv.cur{opacity:1}
.circ-svg .flow{fill:none;stroke:#fff;stroke-opacity:.85;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:.1 9;pointer-events:none;animation:circ-flow var(--fa,2.1s) linear infinite}
.circ-svg .flow.fv{animation-duration:var(--fv,2.4s)}
.circ-svg .flow.fs{animation-duration:calc(var(--fa,2.1s)*.9)}
@keyframes circ-flow{to{stroke-dashoffset:-18}}
.circ-svg .win{fill:var(--anatomy-paper);stroke:var(--anatomy-hi);stroke-width:.8}
.circ-svg .liq{fill:var(--cold);fill-opacity:.7;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(var(--vol,1));transition:transform 1s}
.circ-svg .lamp{fill:#f2c94c;stroke:var(--anatomy-hi);stroke-width:.9;opacity:var(--lamp,.9);transition:opacity 1s}
.circ-svg .lamp-g{fill:#f2c94c;opacity:calc(var(--lamp,.9)*.35);filter:blur(5px);transition:opacity 1s}

/* turul ghidat */

/* desktop: desenul în stânga, explicația în dreapta */
@container (min-width:700px){
  .fx-body{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:16px}

}

/* --- normalizare: un token de text = un token normalizat (pentru evidențiere) --- */
const GREEK = { 'α': 'alfa', 'β': 'beta', 'γ': 'gama', 'δ': 'delta', 'κ': 'kapa', 'μ': 'micro', 'µ': 'micro' };

/* --- pattern: cuvintele sunt prefixe; "=x" exact; "a+b" = a și b la max. 8 cuvinte distanță; cifrele sunt mereu exacte --- */

const FIGS = {};

  return `<figure class="fig ${cls || ''}">${title ? `<span class="ft">${title}</span>` : ''}${inner}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
}
function wrapTxt(s, n) {
  const out = []; let cur = '';
  s.split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > n && cur) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) out.push(cur);
  return out;
}

}

   Barele bifurcațiilor sunt desenate de fiecare coloană, din mijlocul ei, ca să cadă exact pe săgeata coloanei. */
function arrowSVG(h, open) {
  return `<svg class="ca" width="14" height="${h}" viewBox="0 0 14 ${h}" aria-hidden="true" focusable="false"><line x1="7" y1="0" x2="7" y2="${open ? h : h - 5}"/><path d="M1.5 ${h - 9} L7 ${h} L12.5 ${h - 9} Z"/></svg>`;
}
function renderFlow(f, o) {
  o = o || {};
  let zone = null, num = 0, idx = 0;
  const conn = (e, cls) => { const h = cls && cls.includes('drop') ? (e ? 34 : 22) : (e ? 34 : 26); return `<div class="fc ${cls || ''}" aria-hidden="true">${arrowSVG(h, cls && cls.includes('tofork'))}${e ? `<span class="flab">${e}</span>` : ''}</div>`; };
  const nb = x => String(x).replace(/([↑↓→←⊣]) /g, '$1 ').replace(/(^|[\s(])(Vaso|vaso|Hiper|hiper|Hipo|hipo|Micro|micro|Termo|termo|Glomerulo|glomerulo)(?=[a-zăâîșț]{6,})/g, '$1$2­').replace(/\b(IL|TNF|IFN|COX|EF|TLR|CD|MHC|PGE|LT|LB|C)-(?=[\wαβγ])/g, '$1‑');
  const node = (s, label, zOverride) => {
    const z = s.z || zOverride;
    const showZ = z && z !== zone; if (z) zone = z;
    const body = `<span class="fb">${showZ ? `<span class="fz">${z}</span>` : ''}<b class="ftt">${nb(s.t)}</b>${s.d ? `<span class="fd">${nb(s.d)}</span>` : ''}${s.x ? '<span class="fx">explicație suplimentară</span>' : ''}${s.w ? `<span class="fq">de ce?</span><span class="why">${s.w}</span>` : ''}</span>`;
    const lab = o.plain ? '' : label;
    const cls = `fn ${s.k || ''} ${lab ? '' : 'nonum'}`;
    return (s.w ? `<button type="button" class="${cls}" data-act="why" aria-expanded="false">${lab ? `<span class="fnum">${lab}</span>` : ''}${body}</button>` : `<div class="${cls}">${lab ? `<span class="fnum">${lab}</span>` : ''}${body}</div>`)
      + (s.side ? `<div class="side">${s.side.t}</div>` : '');
  };
  const items = f.steps.map((s, si) => {
    const first = si === 0, lastItem = si === f.steps.length - 1;
    num++;
    if (s.br) {
      const n = s.br.length, z0 = zone, st = n >= 3 || o.stack ? 'st' : '';
      const cols = s.br.map((col, ci) => {
        zone = ci > 0 ? (s.z || z0) : z0;
        let h = conn(col[0].e, 'drop');
        col.forEach((x, k) => { if (k) h += conn(x.e); h += node(x, k === 0 ? num + 'abcd'[ci] : '', k === 0 && ci === 0 ? s.z : null); });
        if (!lastItem) h += '<div class="rise" aria-hidden="true"></div>';
        return `<div class="fcol">${h}</div>`;
      }).join('');
      zone = s.z || zone;
      return `<div class="fi fbr" data-i="${idx++}">${first ? '' : conn(s.e, 'tofork ' + st)}<div class="fork n${n} ${st} ${lastItem ? '' : 'join'}"><span class="fpar">în paralel</span>${cols}</div></div>`;
    }
    return `<div class="fi" data-i="${idx++}">${first ? '' : conn(s.e)}${node(s, String(num))}</div>`;
  }).join('');
  const hasWhy = f.steps.some(s => s.w || (s.br && s.br.some(c => c.some(x => x.w))));
  const tools = o.tools && !o.plain ? `<div class="flow-tools">
      <button type="button" class="btn sm soft" data-act="stepstart">Pas cu pas</button>
      <button type="button" class="btn sm" data-act="essopt" aria-pressed="${!!o.ess}">${o.ess ? 'Arată detaliile' : 'Doar esențialul'}</button></div>` : '';
  return `<div class="flow ${o.tone || ''} ${o.plain ? 'plain' : ''}" ${o.key ? `id="fl-${o.key}" data-key="${o.key}"` : ''} data-n="${idx}">
    ${f.t || tools ? `<div class="flow-h">${f.t ? `<b>${f.t}</b>` : ''}${tools}</div>` : ''}
    <div class="fl">${items}</div>
    ${tools ? `<div class="flow-foot" hidden><button type="button" class="btn sm" data-act="stepall">Arată tot</button><button type="button" class="btn sm primary" data-act="stepnext">Următorul pas</button></div>` : ''}
    ${hasWhy && o.tip ? '<p class="flow-tip">Atinge un pas cu „de ce?” ca să vezi explicația.</p>' : ''}
  </div>`;
}

/* ===================== FIGURI INTERACTIVE ===================== */
/* ===== Figuri interactive (FX) =====
   Un motor comun pentru toate figurile interactive. Fiecare figură este o specificație:
     ctl      singura variabilă pe care o manipulezi (cursor sau opțiuni)
     parts    punctele pe care apeși; fiecare are `q`: {nr. întrebare: ['secțiune:punct', ...]} = punctele din barem
     stage    desenul (SVG sau HTML), cu etichete ascunse în modul „Etichete”
     panel    lanțurile de pași care depind de valoarea variabilei
   Modurile: Prezice (întâi alegi, apoi dezvălui), Explorează, Etichete (le completezi tu),
   Ordonează (pașii unei cascade) și Sortează (caracteristici pe stadii), când figura le definește în `games`.
   `neutral`: valoarea cu care se desenează scena înainte de „Dezvăluie” (ca să nu fie dat răspunsul).
   Textul din `parts[].body` este textul diapozitivului; ce nu e în curs poartă `ctx` și sursa lui. */
const FX = { specs: {}, st: new WeakMap(), n: 0, persist: null };

FX.def = function (key, spec) {
  spec.key = key;
  FX.specs[key] = spec;
  FIGMETA[key] = { t: spec.meta || spec.title, q: spec.qs.slice() };
  FIGS[key] = function (o) { return FX.render(key, o || {}); };
};
FX.fmtDef = v => String(v).replace('.', ',');
FX.plain = h => String(h).replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
FX.isOn = function (p, S) { return p.on == null ? true : Array.isArray(p.on) ? p.on.includes(S.stop) : p.on(S); };
FX.rub = function (n, ref) {
  const [s, p] = ref.split(':').map(Number), sec = Q[n].rub[s], pt = sec[1][p];
  return { sec: sec[0], label: pt[0], w: pt[2] || 1 };
};
FX.totalPts = n => Q[n].rub.reduce((a, s) => a + s[1].length, 0);
FX.shuffleA = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
FX.initState = function (spec, o) {
  const c = spec.ctl, S = { mode: spec.tour ? 'tour' : 'explore', tour: 0, tauto: null, stop: 0, v: null, vv: null, seen: new Set(), sel: null, rev: false, qz: null, lab: null, ord: null, sort: null, play: null, key: spec.key };
  if (c.type === 'range') S.v = o.v != null ? +o.v : (spec.initV ? spec.initV(o) : c.init);
  if (spec.tour) S.tour = spec.tourStart ? spec.tourStart(o) : 0;
  else S.stop = o.stop != null ? +o.stop : (c.init || 0);
  return S;
};
/* valoarea desenată: înainte de „Dezvăluie” scena rămâne neutră, ca să nu dea răspunsul */
FX.effV = (spec, S) => {
  if (S.mode === 'tour' && spec.tour) { const st = spec.tour[S.tour]; if (st && st.dv != null) return st.dv; }
  return (spec.neutral != null && ((S.mode === 'predict' && !S.rev) || S.peek)) ? spec.neutral : S.v;
};
FX.stateLabel = function (spec, S) {
  const c = spec.ctl;
  return c.type === 'range' ? (c.fmt || FX.fmtDef)(S.v) : c.stops[S.stop].t;
};

/* ---------- ajutoare de desen ---------- */
FX.helpers = function (spec) {
  const H = {
    /* nod HTML apăsabil (un punct din barem) */
    node(id, cls, extra) {
      const p = spec.parts[id]; if (!p) throw new Error('part? ' + id);
      return `<button type="button" class="fxp fxn ${cls || ''} ${p.ctx ? 'ctxn' : ''}" data-p="${id}" aria-pressed="false">${p.node || `<b>${p.t}</b>`}${extra || ''}</button>`;
    },
    /* grup SVG apăsabil */
    spart(id, inner, cls) {
      const p = spec.parts[id]; if (!p) throw new Error('part? ' + id);
      return `<g class="fxp ${cls || ''}" data-p="${id}" tabindex="0" role="button" aria-label="${esc(FX.plain(p.t))}">${inner}</g>`;
    },
    /* etichetă ascunsă (HTML) */
    lab(id, text, cls) {
      return `<span class="lab ${cls || ''}" data-lab="${id}" data-text="${esc(text)}"><span class="lr">${text}</span><span class="lq" aria-hidden="true">?</span></span>`;
    },
    /* etichetă ascunsă în SVG, centrată pe (cx, cy) */
    slab(id, text, cx, cy, o) {
      o = o || {}; const fs = o.fs || 11, lh = fs + 2, cls = o.cls || 't';
      const lines = o.lines || [text], n = lines.length;
      const y0 = cy - (n - 1) * lh / 2 + fs * .35;
      const w = o.w || 44, hh = o.h || 17;
      return `<g class="lab" data-lab="${id}" data-text="${esc(text)}">`
        + `<text class="lr ${cls}" x="${cx}" y="${y0.toFixed(1)}" text-anchor="middle" font-size="${fs}">${lines.map((l, i) => `<tspan x="${cx}" dy="${i ? lh : 0}">${esc(l)}</tspan>`).join('')}</text>`
        + `<g class="lq"><rect class="lq-r" x="${(cx - Math.min(w, 80) / 2).toFixed(1)}" y="${(cy - Math.min(hh, 24) / 2).toFixed(1)}" width="${Math.min(w, 80)}" height="${Math.min(hh, 24)}" rx="5"/><text class="lq-t" x="${cx}" y="${(cy + 4.2).toFixed(1)}">?</text></g></g>`;
    },
    /* etichetă cu linie de ghidaj care se termină pe piesă: (tx,ty) = punctul de pe piesă, (lx,ly) = capătul etichetei.
       al = 'l' | 'r' | 'c': unde stă textul față de (lx,ly). Linia se termină într-un punct, ca în skill-ul anima. */
    co(id, text, tx, ty, lx, ly, al, o) {
      o = o || {}; const fs = o.fs || 11, lines = o.lines || [text], w = Math.max(...lines.map(l => l.length)) * fs * .56 + 6;
      const cx = al === 'l' ? lx - w / 2 : al === 'r' ? lx + w / 2 : lx;
      const lead = `<path class="lead" d="M${tx} ${ty}L${lx} ${ly}"/><circle class="lead-d" cx="${tx}" cy="${ty}" r="2.1"/>`;
      return `<g class="co">${lead}${H.slab(id, text, cx, ly + (o.dy || 0), { fs, lines, cls: o.cls || 't', w: Math.min(80, w), h: lines.length > 1 ? 30 : 17 })}</g>`;
    },
    wrap: (s, n) => wrapTxt(s, n),
    esc,
  };
  return H;
};

/* ---------- construirea figurii ---------- */
FX.ctlHTML = function (spec, S, id) {
  const c = spec.ctl;
  if (c.type === 'range') {
    return `<div class="fx-ctl"><label class="fx-cl" for="${id}-r"><span>${c.label}</span><output data-var>${(c.fmt || FX.fmtDef)(S.v)}</output></label>
      <input class="fx-range" id="${id}-r" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${S.v}" data-fxr aria-valuetext="${(c.fmt || FX.fmtDef)(S.v)}">
      ${c.peek ? `<div class="fx-playrow"><button type="button" class="btn soft fx-peek" data-fxa="peek" aria-pressed="false">${c.peek}</button></div>` : ''}
      <p class="fx-now" data-now></p></div>`;
  }
  return `<div class="fx-ctl"><div class="fx-cl"><span id="${id}-l">${c.label}</span></div>
    <div class="fx-stops" role="group" aria-labelledby="${id}-l">${c.stops.map((s, i) => `<button type="button" data-fxa="stop" data-i="${i}" aria-pressed="${i === S.stop}">${s.t}</button>`).join('')}</div>
    <p class="fx-now" data-now></p></div>`;
};
FX.render = function (key, o) {
  const spec = FX.specs[key], id = 'fx' + (++FX.n), S = FX.initState(spec, o), H = FX.helpers(spec);
  const learn = [];
  if (spec.tour) learn.push(['tour', 'Tur ghidat']);
  learn.push(['explore', 'Explorează']);
  const prac = [['predict', 'Prezice'], ['labels', 'Etichete']];
  if (spec.games && spec.games.order) prac.push(['order', spec.games.order.mode || 'Ordonează']);
  if (spec.games && spec.games.sort) prac.push(['sort', spec.games.sort.mode || 'Sortează']);
  const qs = spec.qs.map(q => `<span>Î${q}</span>`).join('');
  const KIND = { met: 'metaforă mecanică', chart: 'grafic din tabelul LP', lit: 'schemă literală', mix: 'anatomie schematică' };
  const m0 = S.mode;
  const st0 = spec.stage(o, H, S), ST = typeof st0 === 'string' ? { view: st0, legend: '' } : st0;
  const seg = arr => arr.map(([m, l]) => `<button type="button" data-fxa="mode" data-m="${m}" aria-pressed="${m === m0}">${l}</button>`).join('');
  return `<figure class="fig xfig" id="${id}" data-fx="${key}" data-mode="${m0}" data-rev="0" data-anim="${typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1}" data-q="${o.q || ''}" data-stop="${S.stop}"${S.v != null ? ` data-v="${S.v}"` : ''}>
    <div class="fx-head"><span class="ft">${spec.title}</span>
      <div class="fx-meta"><span class="fx-kind ${spec.kind}">${KIND[spec.kind] || spec.kind}</span><span class="fx-qs">${qs}</span>
      <button type="button" class="fx-info" data-fxa="info" aria-expanded="false">Despre desen</button>
      <button type="button" class="fx-anim" data-fxa="anim" aria-pressed="true" title="Pornește sau oprește mișcarea din desen">Mișcare: pornită</button></div></div>
    <p class="fx-note" data-note hidden>${spec.note}</p>
    <div class="fx-nav" role="group" aria-label="Mod de lucru">

        <div class="fx-bank" data-bank hidden></div>
